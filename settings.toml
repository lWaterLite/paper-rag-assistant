# paper-rag-assistant 非敏感工程配置
#
# 配置树按照系统数据流排列：
#   ingestion（加载、清洗、切分）
#       -> indexing（向量化、持久化、索引构建）
#       -> retrieval（在线召回与结果处理）
#
# .env 仅保留 API key、令牌等敏感配置。


# =============================================================================
# 1. Ingestion：原始文档 -> 可索引 DocumentChunk
# =============================================================================

[ingestion.loader]
recursive = true
ignored_dir_names = [".git", ".idea", "__pycache__", ".tmp_tests"]
ignored_relative_paths = ["data/indexes"]
skip_hidden_paths = true
temporary_file_prefixes = ["~$"]
temporary_file_suffixes = [".tmp", ".part", ".crdownload"]

[ingestion.cleaning.pdf]
edge_line_count = 2
min_repeat_ratio = 0.6
min_line_length = 3
max_line_length = 120

[ingestion.chunking]
strategy = "section_aware"
chunk_size = 600
chunk_overlap = 100
tokenizer = "char_approx"

[ingestion.chunking.report]
output_dir = "logs"

[ingestion.report]
output_dir = "logs"


# =============================================================================
# 2. Indexing：DocumentChunk -> Embedding -> 持久化索引
# =============================================================================

[indexing.embedding]
provider = "mock"
model = "mock-hash-embedding"
dimension = 16
batch_size = 32
timeout_seconds = 30.0
max_retries = 2

[indexing.vector_repository]
type = "local_json"
index_dir = "data/indexes"
collection_name = "papers_baseline"
distance_metric = "cosine"
persist = true

[indexing.builder]
manifest_filename = "manifest.json"
build_report_filename = "index_build_report.json"
skip_existing = true
fail_on_empty_chunk = true


# =============================================================================
# 3. Retrieval：持久化索引 + Query -> RetrievedChunk
# =============================================================================

[retrieval]
strategy = "vector"
top_k = 3
deduplicate_by_chunk_id = true

[retrieval.tokenizer]
strategy = "regex"

[retrieval.bm25]
k1 = 1.5
b = 0.75

[retrieval.hybrid]
candidate_multiplier = 3
rrf_rank_constant = 60
vector_weight = 1.0
bm25_weight = 1.0

[retrieval.reranking]
enabled = true
strategy = "lexical"
candidate_limit = 12
batch_size = 8
failure_mode = "fail_open"

[retrieval.context_packing]
model_context_window = 4096
max_context_tokens = 1800
reserved_prompt_tokens = 200
reserved_output_tokens = 512
safety_margin_tokens = 64
max_chunks_per_document = 2

[retrieval.context_packing.token_estimator]
strategy = "regex"

[retrieval.report]
enabled = true
output_dir = "logs/retrieval"
include_result_text = false
result_preview_chars = 160
fail_on_write_error = false
