# paper-rag-assistant 结构化工程配置
#
# .env 继续用于环境相关、敏感或部署覆盖项。
# 本文件用于 loader、cleaner 等结构化配置。

[loader]
recursive = true
ignored_dir_names = [".git", ".idea", "__pycache__", ".tmp_tests"]
ignored_relative_paths = ["data/indexes"]
skip_hidden_paths = true
temporary_file_prefixes = ["~$"]
temporary_file_suffixes = [".tmp", ".part", ".crdownload"]

[pdf_cleaner]
edge_line_count = 2
min_repeat_ratio = 0.6
min_line_length = 3
max_line_length = 120

[ingestion_report]
output_dir = "logs"

[chunking]
strategy = "section_aware"
chunk_size = 600
chunk_overlap = 100
tokenizer = "char_approx"

[chunking_report]
output_dir = "logs"

[embedding]
provider = "mock"
model = "mock-hash-embedding"
dimension = 16
batch_size = 32
timeout_seconds = 30.0
max_retries = 2
api_key_env_name = "OPENAI_API_KEY"

[vector_store]
type = "local_json"
index_dir = "data/indexes"
collection_name = "papers_baseline"
distance_metric = "cosine"
persist = true

[indexing]
manifest_filename = "manifest.json"
build_report_filename = "index_build_report.json"
skip_existing = true
fail_on_empty_chunk = true
